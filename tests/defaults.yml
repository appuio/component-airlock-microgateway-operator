# Overwrite parameters here

applications:
  - prometheus
  - espejote
  - gateway-api

parameters:
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-espejote/v0.11.0/lib/espejote.libsonnet
        output_path: vendor/lib/espejote.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-prometheus/master/lib/prometheus-alert-patching.libsonnet
        output_path: vendor/lib/alert-patching.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-prometheus/master/lib/prometheus-prom.libsonnet
        output_path: vendor/lib/prom.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-prometheus/master/lib/prometheus.libsonnet
        output_path: vendor/lib/prometheus.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-gateway-api/master/lib/gateway-api.libsonnet
        output_path: vendor/lib/gateway-api.libsonnet

  prometheus:
    alerts:
      ignoreNames: []

  airlock_microgateway_operator:
    gateway_listener_manager:
      enabled: true

    httproute_certificate_manager:
      enabled: true
      base_certificate_spec:
        privateKey:
          size: 4096
