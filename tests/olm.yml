# Overwrite parameters here
applications:
  - openshift-upgrade-controller

parameters:
  facts:
    distribution: openshift4
  dynamic_facts:
    openshiftVersion:
      Major: '4'
      Minor: '19'
      Patch: '0'

  openshift_upgrade_controller:
    namespace: appuio-openshift-upgrade-controller

  airlock_microgateway_operator:
    install_method: olm
    resources:
      operator:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1024Mi
    olm:
      upgrade_strategy:
        manual_upgrade: true
        upgrade_job_hook: true
        upgrade_job_selector:
          matchLabels:
            appuio-managed-upgrade: 'true'
    airlock_xopenshift:
      enabled: true
    gateway_classes:
      test:
        spec:
          controllerName: microgateway.airlock.com/gatewayclass-controller
          parametersRef:
            group: microgateway.airlock.com
            kind: GatewayParameters
            name: gatewayparameter-mgw-poc
            namespace: airlock-gateway
      with-ref:
        parametersRef: 'airlock-gateway/airlock'
      with-ref-no-namespace:
        parametersRef: airlock

    gateway_parameters:
      airlock-gateway/airlock:
        spec:
          defaults:
            downstream:
              remoteIP:
                xff:
                  numTrustedHops: 1
          kubernetes:
            deployment:
              automountServiceAccountToken: false
              engineContainer: {}
              placement: {}
              replicas: 1
            service:
              type: ClusterIP
          logging:
            level: info
      airlock:
        spec:
          defaults:
            downstream:
              remoteIP:
                xff:
                  numTrustedHops: 1
      nulling: null
